name: knot
description: "Knot — macOS HTTP(S)/WebSocket/QUIC packet capture and debugging proxy (Flutter UI)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  get: ^4.6.6
  http: ^1.2.0
  web_socket_channel: ^2.4.0
  multi_split_view: ^3.1.0
  google_fonts: ^6.1.0
  fl_chart: ^0.69.0
  brotli: ^0.6.0
  flutter_svg: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/theme.json
